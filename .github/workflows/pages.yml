name: Paper website

on:
  push:
    paths:
      - "website/**"
      - "notebooks/**"
      - "code/**"
      - "data/raw/**"
      - "data/*.md"
      - ".here"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: tidyverse, here, igraph, lfe, ggraph, patchwork, scales, knitr, rmarkdown, jsonlite
          dependencies: '"hard"'
          install-quarto: false
      - name: Reproduce analysis results
        run: Rscript code/run_all.R
      - name: Build Jupyter notebooks
        run: quarto render notebooks --profile ipynb --to ipynb
      - name: Build companion website
        run: |
          quarto render notebooks
          python3 website/build_site.py
      - name: Save replication outputs
        uses: actions/upload-artifact@v7
        with:
          name: replication-results
          path: output/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site
          retention-days: 7

  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
